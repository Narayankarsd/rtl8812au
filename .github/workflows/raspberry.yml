name: Build RTL8821AU Module for Xiaomi Lavender

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rtl8812au driver
        uses: actions/checkout@v4
        with:
          path: rtl8812au

      - name: Checkout lavender kernel source
        uses: actions/checkout@v4
        with:
          repository: Narayankarsd/Xiaomi_Kernel_OpenSource
          path: kernel
          ref: lavender-q-oss
          fetch-depth: 0
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc kmod libssl-dev flex bison wget xz-utils

      - name: Download Linaro toolchains
        run: |
          wget https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          wget https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-linux-gnueabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz
          echo "${GITHUB_WORKSPACE}/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu/bin" >> $GITHUB_PATH
          echo "${GITHUB_WORKSPACE}/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi/bin" >> $GITHUB_PATH

      - name: Prepare kernel source
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make lavender_defconfig
          make prepare
          make modules_prepare

      - name: Build rtl8812au module
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make -C kernel M=$GITHUB_WORKSPACE/rtl8812au modules

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl8821au.ko
          path: rtl8812au/8812au.ko
